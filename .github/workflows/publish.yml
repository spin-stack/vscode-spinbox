name: Publish

# On a tag v*, a step a task: every platform's VSIX packaged once, attached to a GitHub release of
# the tag with SHA256SUMS signed by this workflow (job release), then published to the Visual
# Studio Marketplace and to Open VSX (job publish), as a pre-release when the tag holds -pre. The
# release comes first and on its own: it exists, and is installable, whether or not a registry is
# set up yet or answers. Both registries trust this workflow in the publish environment by OIDC
# (docs/publishing.md), so no token is kept: the Marketplace retires personal access tokens on
# 2026-12-01. OVSX_PAT is only for Open VSX's first publish, before its trusted publisher can be
# registered; once it is, the secret is deleted and ovsx exchanges the job's ID token instead.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  # A publish half done is finished by running it again, never by a second run cancelling it.
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      # The release and its files.
      contents: write
      # Keyless signing: cosign exchanges the job's ID token for a certificate naming this
      # workflow at the tag, which is what `spin vscode install` holds SHA256SUMS to.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache, as in ci.yml: Socket Firewall sees only what is asked of the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task publish:check
      - run: go tool task install
      - run: go tool task package:all
      - run: go tool task publish:github
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The registries publish these very bytes, the ones SHA256SUMS lists, not a second package.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spinbox-vsix
          path: spinbox-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      # The token each registry exchanges for a short-lived publishing credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task publish:check
      - run: go tool task install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spinbox-vsix
      - run: go tool task publish:marketplace
      - run: go tool task publish:openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
