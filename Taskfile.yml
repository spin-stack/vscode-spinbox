version: '3'

# The VS Code extension spin-stack.spinbox: TypeScript in src/, bundled by esbuild into dist/,
# packaged by vsce. Every install goes through Socket Firewall (go tool sfw), and every workflow
# step is one of these tasks (go tool taskgate), so a developer runs what CI runs.

vars:
  # The release a publish is for: the tag a workflow runs on, or TAG=v1.2.3 on the command line.
  TAG: '{{.GITHUB_REF_NAME}}'
  # A tag with -pre in it is a pre-release: vsce publishes a VSIX as one only when it was packaged
  # as one, so package:all has to give this to vsce package too.
  PRE_RELEASE: '{{if contains "-pre" .TAG}}--pre-release{{end}}'

tasks:
  install:
    desc: Install the dependencies from the lockfile, through Socket Firewall (go tool sfw).
    cmds:
      - go tool sfw pnpm install --frozen-lockfile

  build:
    desc: Bundle the extension into dist/extension.js.
    cmds:
      - pnpm build

  lint:
    desc: Lint and check the formatting with Biome.
    cmds:
      - pnpm lint

  typecheck:
    desc: Typecheck src/ and test/ with tsc.
    cmds:
      - pnpm typecheck

  test:
    desc: The unit tests - Vitest, against the fake spin in test/fake-spin/, and hack/'s Go.
    cmds:
      - pnpm test
      - go test ./hack/...

  test:integration:
    desc: Activate the extension in a real VS Code, downloaded into .vscode-test/. Under xvfb-run when it is installed, which CI's runner has; otherwise on the display there is.
    vars:
      XVFB:
        sh: command -v xvfb-run || true
    cmds:
      - task: build
      - '{{if .XVFB}}xvfb-run -a {{end}}pnpm test:integration'

  package:
    desc: Package the extension into spinbox.vsix with vsce, without the CLI - what CI's gate checks packages. package:all makes the ones that are published.
    cmds:
      - task: build
      - pnpm package

  package:spin:
    desc: Pull the spin CLI versions.yaml pins for every platform its release has, into build/spin/<target>/spin with its VERSION, each checked with cosign against what spin's release workflow signed and attested of that release (hack/spinbin). A platform the release lacks is skipped, and said.
    vars:
      SPIN:
        sh: go tool versions version spin
      COSIGN:
        sh: echo "go run github.com/sigstore/cosign/v3/cmd/cosign@$(go tool versions version cosign)"
    cmds:
      - rm -rf build/spin
      - go run ./hack/spinbin -version {{.SPIN}} -out build/spin -cosign '{{.COSIGN}}'

  package:all:
    desc: One VSIX per platform the pinned spin release has a CLI for, spinbox-<target>.vsix, each carrying only its own checked CLI at bin/<target>/spin and the release it is in bin/<target>/VERSION, where the extension looks for them (src/cli/binary.ts). A CLI cosign refuses fails the task before any VSIX is made.
    cmds:
      - rm -f spinbox-*.vsix
      - task: package:spin
      - task: build
      - |
        set -eu
        for dir in build/spin/*/; do
          target=$(basename "$dir")
          rm -rf bin && mkdir -p "bin/$target" && cp "$dir/spin" "$dir/VERSION" "bin/$target/"
          pnpm exec vsce package --no-dependencies --skip-license {{.PRE_RELEASE}} --target "$target" --out "spinbox-$target.vsix"
        done
        rm -rf bin

  publish:
    desc: Package every platform and publish each VSIX to the Visual Studio Marketplace and to Open VSX - what the Publish workflow runs on a tag v*, step by step. VSCE_PAT and OVSX_PAT hold the tokens; TAG=v1.2.3 names the release outside a workflow.
    cmds:
      - task: publish:check
      - task: package:all
      - task: publish:marketplace
      - task: publish:openvsx

  publish:check:
    desc: Fail before anything is built when a token is missing, or when the tag is not v and package.json's version - a VSIX carries the version it was packaged with, never the tag's.
    env:
      TAG: '{{.TAG}}'
    silent: true
    cmds:
      # An Actions secret nobody created reads as empty, and vsce or ovsx would only say "no token".
      # Every missing one is named, so whoever creates them creates both at once.
      - cmd: |
          missing=$(for s in VSCE_PAT OVSX_PAT; do [ -n "$(printenv "$s")" ] || printf ' %s' "$s"; done)
          if [ -n "$missing" ]; then
            echo "publish: not set:$missing - secrets of this repository's 'publish' environment (README.md, Publishing)" >&2
            exit 1
          fi
      # The Marketplace refuses a semver pre-release version, so v0.2.0-pre ships package.json's 0.2.0.
      - cmd: |
          if [ "${TAG%%-pre*}" != "v$(node -p 'require("./package.json").version')" ]; then
            echo "publish: the tag '$TAG' is not v and package.json's version, with -pre after it for a pre-release" >&2
            exit 1
          fi

  publish:marketplace:
    desc: Publish every VSIX in the repository's root to the Visual Studio Marketplace, with the token in VSCE_PAT.
    cmds:
      # --skip-duplicate: a run that failed on Open VSX is run again whole, and what the Marketplace already has is no error.
      - pnpm exec vsce publish --skip-duplicate {{.PRE_RELEASE}} --packagePath *.vsix

  publish:openvsx:
    desc: Publish every VSIX in the repository's root to Open VSX, with the token in OVSX_PAT.
    cmds:
      - pnpm exec ovsx publish --skip-duplicate {{.PRE_RELEASE}} --packagePath *.vsix

  gate:
    desc: What holds the repository's shape - every install through the firewall, and every workflow step a task.
    cmds:
      - go tool sfw check
      - go tool taskgate

  ci:
    desc: What CI's Gate job runs - the gate, the install, lint, typecheck, the unit tests, and the package. test:integration is its own job.
    cmds:
      - task: gate
      - task: install
      - task: lint
      - task: typecheck
      - task: test
      - task: package
