name: Publish

# task publish on a tag v*, a step a task: every platform's VSIX to the Visual Studio Marketplace
# and to Open VSX, as a pre-release when the tag holds -pre. Both registries trust this workflow in
# the publish environment by OIDC (docs/publishing.md), so no token is kept: the Marketplace retires
# personal access tokens on 2026-12-01. OVSX_PAT is only for Open VSX's first publish, before its
# trusted publisher can be registered; once it is, the secret is deleted and ovsx exchanges the
# job's ID token instead.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  # A publish half done is finished by running it again, never by a second run cancelling it.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      # The token each registry exchanges for a short-lived publishing credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache, as in ci.yml: Socket Firewall sees only what is asked of the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task publish:check
      - run: go tool task install
      - run: go tool task package:all
      - run: go tool task publish:marketplace
      - run: go tool task publish:openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
