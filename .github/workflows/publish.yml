name: Publish

# task publish on a tag v*, a step a task: every platform's VSIX to the Visual Studio Marketplace
# and to Open VSX, as a pre-release when the tag holds -pre. The tokens are the secrets of the
# publish environment (README.md, Publishing); each reaches only the step that sends it.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  # A publish half done is finished by running it again, never by a second run cancelling it.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache, as in ci.yml: Socket Firewall sees only what is asked of the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task publish:check
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: go tool task install
      - run: go tool task package:all
      - run: go tool task publish:marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: go tool task publish:openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
