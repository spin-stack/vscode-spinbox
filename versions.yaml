# What the extension pins from outside it, but its npm packages (pnpm-lock.yaml), go-tools' cmd/task
# (go.mod) and the actions the workflows run (Dependabot's). It is go-tools' versions format:
# `versions version <name>` reads an entry from a task, `versions check` says what is behind.

- name: spin
  kind: git
  source: https://github.com/spin-stack/spin
  version: v20261110.01
  pin: b7ba5206f12ba93a829a48e354be7fce6bc65db4
  track: github-release
  note: >-
    The release whose CLI each VSIX carries (task package:all), pulled from its public package
    ghcr.io/spin-stack/spin-release and held by cosign to what spin's release workflow signed and
    attested of this version. A platform the release has no CLI for gets no VSIX, and package:all
    says so. The CLI is the extension's only client of an installation, so a bump is the CLI's
    contract checked against src/cli/contract.ts and the extension tried against an installation
    of that release.

- name: cosign
  kind: module
  source: github.com/sigstore/cosign/v3/cmd/cosign
  version: v3.1.4
  track: github-release https://github.com/sigstore/cosign
  note: >-
    What checks each CLI package:all puts in a VSIX, run with go run at this version, so the
    checksum database holds it to its bytes and no runner needs it installed. spin-machine pins
    it too: keep the two at one version. A bump is checked with task package:all, and with a
    binary altered by a byte, which it must refuse.

- name: task
  kind: download
  source: https://github.com/go-task/task/releases/download/v{version}/task_{os}_{arch}.tar.gz
  version: 3.54.0
  pins:
    linux/amd64: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
    linux/arm64: d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b
    darwin/amd64: 0543b0844a725814c0412d3f4bed12873ce9ed0da207b15775f63a97d734aac0
    darwin/arm64: 12a69fcf37bb8d5bc9150c44f9a936775b73e59ff044c2c245232f198c135637
  track: github-release https://github.com/go-task/task
  note: >-
    The Task `go tool task` runs (go-tools' cmd/task), for every platform a person or a runner
    works on: no repository compiles it.

- name: vscode
  kind: git
  source: https://github.com/microsoft/vscode
  version: 1.145.2
  pin: c4453f8ea430795f941c1b2ff6c9321135a74a02
  track: github-release
  note: >-
    The VS Code stable test:integration checks the resolver's detection against
    (test/integration/run.mjs), downloaded by @vscode/test-electron. It has to be a release that
    withholds a proposed API from an extension argv.json does not name: up to at least 1.128,
    isProposedApiEnabled answered true for any extension that declared one, so the stand-in
    activates either way and the run without the flag fails. A bump is test:integration green.
