version: '3'

# The VS Code extension spin-stack.spinbox: TypeScript in src/, bundled by esbuild into dist/,
# packaged by vsce. Every install goes through Socket Firewall (go tool sfw), and every workflow
# step is one of these tasks (go tool taskgate), so a developer runs what CI runs.

tasks:
  install:
    desc: Install the dependencies from the lockfile, through Socket Firewall (go tool sfw).
    cmds:
      - go tool sfw pnpm install --frozen-lockfile

  build:
    desc: Bundle the extension into dist/extension.js.
    cmds:
      - pnpm build

  lint:
    desc: Lint and check the formatting with Biome.
    cmds:
      - pnpm lint

  typecheck:
    desc: Typecheck src/ and test/ with tsc.
    cmds:
      - pnpm typecheck

  test:
    desc: The unit tests - Vitest, against the fake spin in test/fake-spin/, and hack/'s Go.
    cmds:
      - pnpm test
      - go test ./hack/...

  test:integration:
    desc: Activate the extension in a real VS Code, downloaded into .vscode-test/. Under xvfb-run when it is installed, which CI's runner has; otherwise on the display there is.
    vars:
      XVFB:
        sh: command -v xvfb-run || true
    cmds:
      - task: build
      - '{{if .XVFB}}xvfb-run -a {{end}}pnpm test:integration'

  package:
    desc: Package the extension into spinbox.vsix with vsce, without the CLI - what CI's gate checks packages. package:all makes the ones that are published.
    cmds:
      - task: build
      - pnpm package

  package:spin:
    desc: Pull the spin CLI versions.yaml pins for every platform its release has, into build/spin/<target>/spin, each checked with cosign against what spin's release workflow signed and attested of that release (hack/spinbin). A platform the release lacks is skipped, and said.
    vars:
      SPIN:
        sh: go tool versions version spin
      COSIGN:
        sh: echo "go run github.com/sigstore/cosign/v3/cmd/cosign@$(go tool versions version cosign)"
    cmds:
      - rm -rf build/spin
      - go run ./hack/spinbin -version {{.SPIN}} -out build/spin -cosign '{{.COSIGN}}'

  package:all:
    desc: One VSIX per platform the pinned spin release has a CLI for, spinbox-<target>.vsix, each carrying only its own checked CLI at bin/<target>/spin. A CLI cosign refuses fails the task before any VSIX is made.
    cmds:
      - rm -f spinbox-*.vsix
      - task: package:spin
      - task: build
      - |
        set -eu
        for dir in build/spin/*/; do
          target=$(basename "$dir")
          rm -rf bin && mkdir -p "bin/$target" && cp "$dir/spin" "bin/$target/spin"
          pnpm exec vsce package --no-dependencies --skip-license --target "$target" --out "spinbox-$target.vsix"
        done
        rm -rf bin

  gate:
    desc: What holds the repository's shape - every install through the firewall, and every workflow step a task.
    cmds:
      - go tool sfw check
      - go tool taskgate

  ci:
    desc: What CI's Gate job runs - the gate, the install, lint, typecheck, the unit tests, and the package. test:integration is its own job.
    cmds:
      - task: gate
      - task: install
      - task: lint
      - task: typecheck
      - task: test
      - task: package
