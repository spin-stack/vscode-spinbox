name: Package

# task package:all on every pull request: one VSIX per platform the pinned spin release has a
# CLI for, each CLI checked with cosign before it is packaged, uploaded for a person to install.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

# go-tools' downloads (sfw, versions) ask GitHub with this: anonymous ones are the first it sheds
# under load, and they answered 504 for minutes on 2026-11-09.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No store cache: a package restored from one is never asked of the registry, so Socket
      # Firewall, which stands between the two, would not see it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task install
      - run: go tool task package:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spinbox-vsix
          path: spinbox-*.vsix
          if-no-files-found: error
